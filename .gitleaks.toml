# Secret scanning config for the `gitleaks` job in .github/workflows/security.yml
# (docs/12, SEC-008). Everything gitleaks ships with stays on; this file only
# records the places its heuristics misfire on this repo. Each allowlist is
# scoped — to a rule, a path, or an exact literal — so a real credential in the
# same file still fails the build.
#
# Real secrets live in wrangler secrets and Docker env (CLAUDE.md §10). If a
# finding here is ever a genuine credential, rotate it first; do not widen this
# file to make the build pass.

[extend]
useDefault = true

# Prose, not credentials. `generic-api-key` fires whenever a sentence puts a
# slashed phrase next to the word "API" ("metrics push API, brief/anomaly
# webhooks") or "scraping, news/regulatory".
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Requirements and spec prose"
paths = ['''^docs/''']

# `queryRows(token, "north/briefings", …)` — a variable named `token` beside a
# slashed API path is enough for `generic-api-key`'s heuristic. The path is the
# endpoint; the token is a runtime session value (apps/mobile/src/session.tsx).
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Mobile API calls that pass the session token as a variable"
regexTarget = "line"
regexes = ['''queryRows\(\s*token,''']

# An idempotency key is a dedupe token the caller chooses and may repeat
# (docs/19 §4) — the opposite of a secret. `generic-api-key` scores the hyphen-
# and-digit shape of one as high entropy.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Idempotency keys are request identifiers, not credentials"
regexTarget = "line"
regexes = ['''idempotencyKey:\s*["'`]''']

# .env.example ships placeholders on purpose — that is what makes it an example.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Placeholders in the env template"
regexes = ['''REPLACE_ME[A-Z0-9_]*''']

# Fixed demo values: the seed's fake tenant API keys, the scrubber's synthetic
# AWS token and JWT (the test exists to prove they get redacted), the
# field-crypto test key, the webhook-signature fixture, a metric named
# `*_key`, the streaming eval's fake leaked key (the case proves the redactor
# catches it). Matched as exact literals, not patterns.
[[allowlists]]
description = "Synthetic fixtures and seed demo data"
regexes = [
  '''qvk_live_a1b2c3d4''',
  '''qvk_live_e5f6g7h8''',
  '''AKIAABCDEFGHIJKLMNOP''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.''',
  '''s0me-32-byte-ish-secret-from-wrangler''',
  '''whsec_ABC123''',
  '''quote_latency_p95''',
  '''abcdefgh12345678'''
]

# The same prose heuristic as docs/, in a code comment: scout-ingest.ts
# describes "scraping, news/regulatory" feeds.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Prose in the scout ingest header comment"
condition = "AND"
paths = ['''^apps/api/src/engines/scout-ingest\.ts$''']
regexTarget = "line"
regexes = ['''scraping, news/regulatory''']
