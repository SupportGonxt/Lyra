name: ci

on:
  pull_request:
  workflow_call:
    secrets:
      CF_ACCOUNT_ID:
        required: false
      CF_AI_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in package.json — no duplicate pin.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # docs/10 §5 order. Separate steps so a failure names its own gate.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # Typecheck does not catch a server-only module reaching the client
      # bundle — only the bundler does, and until this step existed the first
      # report was a failed production deploy.
      - run: pnpm --filter @lyra/web build

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval

  # docs/27 F10 / docs/13 §3.6: the deterministic suite above cannot see a
  # prompt or model regression, so this one calls the real model through the
  # real Gateway. Not on the PR path — it costs money and needs network — but a
  # model or tier change that skips it is a change nobody measured. `secrets` on
  # a job is not inherited by fork PRs, and with LYRA_EVAL_LIVE=1 a missing key
  # fails rather than skips, so this deliberately does not run on pull_request.
  eval-live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The account id is genuinely one value, so the deploy copy is a fine
    # fallback. The TOKEN is not: CLOUDFLARE_API_TOKEN is scoped to deploy
    # (Workers Scripts / D1 / KV) and 401s on `ai/run`, which is how a green
    # PR turned into a red main and a staging deploy that never fired —
    # `FAIL cloudflare ai/run …: 401 Authentication error`. A token that
    # cannot reach the model is not a cheaper copy of one that can, so the
    # fallback is gone and the gate is honest about being unconfigured.
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Loud, not silent: an unconfigured live gate is a visible annotation on
      # every push until someone adds `CF_AI_TOKEN` (a token with Workers AI
      # Read) or `ANTHROPIC_API_KEY`. It is not a pass.
      - if: env.CF_AI_TOKEN == '' && env.ANTHROPIC_API_KEY == ''
        run: echo "::warning title=live eval gate not configured::no CF_AI_TOKEN or ANTHROPIC_API_KEY — live model evals did not run"
      - if: env.CF_AI_TOKEN != '' || env.ANTHROPIC_API_KEY != ''
        run: pnpm --filter @lyra/model-gateway eval:live

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # Traces and error-context snapshots for the failures. Without these a
      # journey that fails only on the runner can only be guessed at from the
      # log — which is how J-E1/J-O3 cost a whole triage cycle.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failures
          path: test-results/
          retention-days: 7

  # docs/13 §6 / CLAUDE.md §7: mutation score gate, break threshold 70.
  # packages/core cleared it 2026-07-31 (97.57%, was 28.56%). model-gateway
  # cleared it 2026-08-01 (84.92%, was 40.98%). Both packages now block.
  #
  # One job per package, `fail-fast: false`. This used to be a single step
  # running `pnpm mutation`, which is `core && model-gateway` — so when core
  # stalled, model-gateway's gate never ran at all and its result was neither
  # pass nor fail, it was absent. Separate jobs cannot silence each other.
  mutation:
    strategy:
      fail-fast: false
      matrix:
        package: [core, model-gateway]
    runs-on: ubuntu-latest
    # A gate that never finishes reports nothing, and that is worse than a red
    # one: both deploy jobs are `needs: checks`, so an unbounded mutation job
    # parks the deploy instead of failing it — the #26 merge push sat here for
    # over an hour. This is a ceiling, not a budget: model-gateway is ~1m, and
    # #26's whole-PR core scope measured ~36m locally once the fixture tree came
    # out of the mutate set (see the step comment). Tripping it is a hard
    # failure with a named reason, which a human can act on. Do not raise it to
    # make a run fit — shrink the scope or make the tests cheaper.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # STRYKER_SINCE diffs against a ref, so it needs history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Diff-scoped, not whole-tree. Whole-tree packages/core is 15,392 mutants,
      # 13,471 of them (88%) static, ETA 45-53h — past any runner ceiling, so
      # the run was always killed and the gate reported nothing at all. The
      # break threshold is untouched at 70: a commit that drops below it on the
      # code it edits still fails.
      #
      # Scoping alone was NOT the fix, and assuming it was is what parked the
      # #26 merge push for an hour. `HEAD^` on a merge commit is `HEAD^1`, the
      # pre-merge main tip, so the diff is the whole PR — correct in the git
      # sense, but #26's core diff included packages/core/src/seed/ledger.ts,
      # 1,914 lines of fixture data. Measured on seed.ts, a sibling: 1,852
      # mutants of which 1,821 (98%) are static, ETA 2h42m-4h24m. Static mutants
      # cost a full suite re-run each instead of just their covering tests, so
      # ONE touched fixture file reproduces the whole-tree stall by itself.
      #
      # So the fixture tree (src/seed.ts, src/seed/**) is out of the mutate set.
      # That is the only thing excluded here, and exactly what it leaves ungated
      # is spelled out at the bottom of packages/core/stryker.config.mjs. It is
      # data, not logic; its own tests still run under `pnpm test`. Nothing is
      # skipped per-event and no job is made non-blocking.
      #
      # Measured with it out, on #26's own merge-push scope: 947 mutants, only 2
      # timing out — core stops being static-dominated, a ~16x reduction. Local
      # wall time ~36m on a contended 10-core box.
      #
      # ponytail: the remaining ceiling is that core's suite is 97s/559 tests
      # (DB-backed seed tests sit in the covering set of most core modules), so
      # cost is roughly linear in changed non-fixture files and a very large
      # core diff can still hit `timeout-minutes` above. That is a loud red
      # build, not a silent pass. Upgrade path when it starts tripping: Stryker
      # `incremental` with an actions/cache of .stryker-tmp/incremental.json, so
      # a run only re-tests mutants whose covering tests changed.
      #
      # Scope per trigger (this workflow runs on `pull_request` directly, and
      # via workflow_call from deploy.yml on push-to-main / workflow_dispatch,
      # where `github.event*` is the CALLER's event):
      #   pull_request      origin/<base>... — three dots, i.e. the MERGE BASE,
      #                     so a branch that is behind main does not report
      #                     main's own commits as "changed".
      #   push to main      github.event.before, the previous main tip. On a
      #                     merge commit that is HEAD^1, covering the whole PR.
      #   workflow_dispatch no `before` in the payload, so `HEAD^` — the last
      #                     thing that landed on main. NOT empty: an empty value
      #                     makes scripts/stryker-changed.mjs sweep the whole
      #                     tree, which is the 45h run, i.e. the production
      #                     dispatch could never go green.
      - run: pnpm --filter @lyra/${{ matrix.package }} mutation
        env:
          STRYKER_SINCE: ${{ github.event_name == 'pull_request' && format('origin/{0}...', github.base_ref) || github.event.before || 'HEAD^' }}

# a11y gate (CLAUDE.md WCAG 2.2 AA): e2e/a11y.ts's expectNoA11yViolations
# (axe-core, tags wcag2a/wcag2aa/wcag22aa) runs inside the existing journey
# specs (e2e/login.spec.ts, e2e/staff.spec.ts) — no separate job needed, the
# `e2e` job above already fails the build on any assertion failure, this one
# included.
#
# The 2026-07-31 note here — that `pnpm e2e` could not boot because
# apps/api/src/node.ts pulls in engines/agent-room.ts and its bare
# `import { DurableObject } from "cloudflare:workers"` — no longer holds. The
# four engines that touch that specifier now load it with
# `await import("cloudflare:workers").catch(...)` and fall back to a plain
# base class off workerd, so `tsx src/node.ts` starts. Verified 2026-08-06 on
# a clean DB: 40 passed, 5 skipped.
#
# One local-only trap: e2e/global-setup.ts skips the wipe when the DB file
# already exists (it would yank the inode from a reused API process), so a
# second local run inherits the first one's writes. J-C3 fails that way —
# the seed's one `proposed` offer has already been surfaced, and NBO's
# FREQUENCY_CAP of 3 leaves no room to propose another. `rm -rf
# $TMPDIR/lyra-e2e` before re-running. CI always starts empty.
#
# Runs 31627230986 and 31633595222 failed on the same shape — a `waitForURL`
# timeout after a click that landed, on axis-lifecycle.spec.ts:37,
# ops.spec.ts:157 and ops.spec.ts:221, reproducing on no local run. The cause
# was React Router v8 lazy route discovery, not the specs. Decoding every
# `/__manifest?paths=` request in the trace showed it: the nav that works
# (/admin/products) gets an eager batch AND a second, dedicated 3-path
# discovery request, and completes in 0.3s; the navs that hang
# (/distribution/channels, /axis/policies) get only the eager batch — their
# path is already in it, so the navigation's own discovery is deduped away and
# `navigate()` awaits a promise nothing settles. That happens before any route
# module or `.data` fetch, which is why the trace shows zero network for the
# whole 120s. Fixed with `routeDiscovery: { mode: "initial" }` in
# apps/web/react-router.config.ts — the full manifest ships with the document
# and there is no discovery request to lose. If this shape returns, decode the
# `__manifest` requests in the trace before suspecting the test.
#
# The shape did return (ops.spec.ts:43/169/233), and this time the trace had no
# `__manifest` request to blame — `mode: "initial"` was doing its job. What was
# left in the request path was `vite dev` itself, compiling route modules on
# first reach on a runner with two cores, the API process and two Playwright
# workers on it. `pnpm e2e` on CI now builds apps/web and serves the built
# worker under `wrangler dev` (playwright.config.ts), so the runner exercises
# the artefact that deploys and no compiler sits between a click and its route.
