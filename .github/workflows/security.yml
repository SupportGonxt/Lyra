name: security

# docs/12 §"Vulnerability management": dep audit weekly + scanning in CI.
# Closes traceability SEC-007 (dependency scanning on a schedule) and
# SEC-008 (baseline security scan in CI).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:17 UTC — off the hour so we don't queue behind the world.
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # SEC-007 — dependency vulnerabilities. Gating, not advisory: a high or
  # critical advisory fails the build. Triage is bump-or-ADR, never a
  # continue-on-error.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  # SEC-008 — committed credentials. gitleaks-action refuses to run for an
  # organisation without a paid GITLEAKS_LICENSE secret, so this runs the MIT
  # CLI itself, pinned, against the same .gitleaks.toml.
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - run: curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --exit-code 1 .'

  # SEC-008 — static analysis. apps/ and packages/ are all TS.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      # No build step: the JS/TS extractor reads source directly.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # Copyleft licences are incompatible with shipping Lyra to tenants.
  # LGPL is excluded from the match on purpose — dynamic linking is fine and
  # we already depend on an LGPL-3.0 package.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on GPL/AGPL dependencies
        run: |
          pnpm licenses list --json > licenses.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            // An SPDX expression is only copyleft if EVERY alternative is:
            // node-forge ships "(BSD-3-Clause OR GPL-2.0)" and we take the BSD
            // side. LGPL is fine on its own — dynamic linking, and we already
            // depend on one (@img/sharp-libvips).
            const copyleft = (term) => /\bA?GPL-/.test(term) && !/\bLGPL-/.test(term);
            const bad = Object.entries(JSON.parse(readFileSync("licenses.json", "utf8")))
              .filter(([expr]) => expr.split(/\s+OR\s+/i).every(copyleft))
              .map(([expr, pkgs]) => `${expr}: ${pkgs.map((p) => p.name).join(", ")}`);
            if (bad.length) {
              console.log(`::error::GPL/AGPL-licensed dependency found. Replace it or record an ADR.\n${bad.join("\n")}`);
              process.exit(1);
            }
            console.log("No GPL/AGPL dependencies.");
          '

  # SEC-007, second half — the OS layer of the on-prem image (ops/Dockerfile;
  # there is no infra/onprem and never will be — ADR-0010).
  # `audit` above already gates the npm dependency tree from the lockfile, which
  # is the same tree the image installs, so the gap this closes is the base
  # image's distro packages.
  #
  # ponytail: scans the base image the Dockerfile declares, not a locally built
  # one — building the monorepo image on every PR costs a full `pnpm install &&
  # pnpm build` to rescan packages `audit` has already gated. Ceiling: CVEs
  # introduced by this Dockerfile's own layers (currently one `apt-get install
  # ca-certificates`) are not seen. Upgrade path: when the on-prem image is
  # published to a registry, point image-ref at the published tag.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve base image from ops/Dockerfile
        id: base
        run: |
          base="$(grep -m1 -E '^FROM ' ops/Dockerfile | awk '{print $2}')"
          test -n "$base" || { echo "::error::no FROM in ops/Dockerfile"; exit 1; }
          echo "image=$base" >> "$GITHUB_OUTPUT"
      # ignore-unfixed: an unpatched distro CVE has no action available, and a
      # permanently red gate is a gate someone turns off.
      # vuln-type os: the JS half of a `node:` image is npm's own vendored tree
      # (tar, sigstore, brace-expansion), which ops/Dockerfile deletes and the
      # container never executes; our own JS tree is gated by `audit` above.
      # Tags carry a `v` prefix; the unprefixed `0.28.0` never resolved.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.base.outputs.image }}
          severity: HIGH,CRITICAL
          vuln-type: os
          ignore-unfixed: true
          exit-code: "1"

# ponytail: SEC-019 (prompt-injection / tool-escape red-team suite) is M3 and
# has no runner yet — it belongs in packages/model-gateway/evals and gets its
# own job here once that suite exists.
